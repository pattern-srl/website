<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pattern</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --fg: #f0ede8;
      --muted: #555;
      --accent: #f0ede8;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
    }

    body {
      display: grid;
      grid-template-rows: 1fr auto;
      min-height: 100vh;
      padding: 3rem;
    }

    main {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .wordmark {
      font-family: 'DM Mono', monospace;
      font-weight: 300;
      font-size: clamp(2.5rem, 8vw, 6rem);
      letter-spacing: -0.02em;
      line-height: 1;
      margin-bottom: 2rem;
    }

    .tagline {
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      color: var(--muted);
      font-weight: 300;
      letter-spacing: 0.01em;
      max-width: 40ch;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      padding-top: 2rem;
      border-top: 1px solid #1a1a1a;
    }

    footer a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover {
      color: var(--fg);
    }

    .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #2a2a2a;
      border-radius: 50%;
      margin-right: 0.5rem;
      vertical-align: middle;
      position: relative;
      top: -1px;
    }
  </style>
</head>
<body>
  <main>
    <h1 class="wordmark">Pattern</h1>
    <p class="tagline">Software &amp; industrial automation.<br>Coming soon.</p>
  </main>
  <footer>
    <span><span class="dot"></span>Pattern S.r.l. — Treviso, Italy</span>
    <a href="mailto:info@findpattern.it">info@findpattern.it</a>
  </footer>
</body>
</html>
